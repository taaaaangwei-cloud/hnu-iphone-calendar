[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hnu-iphone-calendar"
version = "0.1.0"
description = "Sync Hainan University timetables to iCloud Calendar and ICS"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.45,<2",
]

[project.scripts]
hnu-calendar = "hnu_calendar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

